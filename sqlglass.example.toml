# Copy to sqlglass.toml (git-ignored) and edit. Never put a password in this file.

[library]
path = "queries"                 # folder of .sql files, relative to this file
default_connection = "erp"

[connections.erp]
server = "sqlprod01.corp.example.com"      # host, host\instance or host,port
database = "ERP_Reporting"
auth = "windows"                 # windows | sql | entra-interactive | entra-integrated | entra-default
max_rows = 200                   # hard cap on rows returned to the assistant
timeout_seconds = 30
include_schemas = ["dbo", "rpt"] # optional: limit what gets introspected
# driver = "ODBC Driver 18 for SQL Server"   # default: newest installed
# encrypt = true
# trust_server_certificate = false           # true for on-prem servers with self-signed certs

[connections.azure]
server = "myserver.database.windows.net"
database = "analytics"
auth = "entra-interactive"       # browser sign-in; needs ODBC Driver 17/18
user = "me@example.com"

[connections.sqlauth]
server = "10.0.0.5,1433"
database = "Reporting"
auth = "sql"
user = "report_reader"           # give this login db_datareader only
password_env = "REPORTING_SQL_PASSWORD"
trust_server_certificate = true

[connections.local]
engine = "sqlite"
path = "C:/data/example.db"
